[package]
name = "change_flare"
version = "0.2.3"
edition = "2024"
rust-version = "1.88"
description = "Keep Cloudflare A/AAAA records in sync with this node's public IP"
license = "MIT"
publish = false

[dependencies]
ctrlc = "3.5"
dotenvy = "0.15.7"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stunclient = { version = "0.4.2", default-features = false }
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
mockito = "1.7.2"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
