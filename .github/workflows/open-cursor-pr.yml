# Open a GitHub pull request after a Cursor Cloud Agent pushes a branch.
#
# Cloud Agent GitHub App tokens cannot create pull requests (403
# "Resource not accessible by integration"). This workflow runs with
# Actions GITHUB_TOKEN, which can.
#
# Optional repo secret PR_CREATE_TOKEN (fine-grained PAT with Pull requests:
# write, Contents: read) makes the resulting PR count as a user-created PR so
# CI workflows still trigger. PRs opened with the default GITHUB_TOKEN do not
# start new workflow runs.
name: Open Cursor pull request

on:
  push:
    branches:
      - "cursor/**"
  workflow_dispatch:

concurrency:
  group: open-cursor-pr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    name: Open pull request if missing
    runs-on: ubuntu-latest
    if: github.ref_name != github.event.repository.default_branch
    steps:
      - name: Check out scripts
        uses: actions/checkout@v4

      - name: Create pull request if needed
        env:
          GH_TOKEN: ${{ secrets.PR_CREATE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/open-pr-if-needed.sh
